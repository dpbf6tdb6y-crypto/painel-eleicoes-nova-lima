<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Eleições — Nova Lima</title>
<style>
  :root{
    --azul:#2f5597; --azul-esc:#22406f; --verde:#46b649; --verde-cl:#54c15c;
    --bg:#eef1f5; --card:#ffffff; --texto:#1f2733; --suave:#6b7683;
    --linha:#e4e8ee; --amarelo:#f2c200;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--texto);font-size:14px}
  a{color:inherit}
  [hidden]{display:none!important}
  #app{display:flex;min-height:100vh}

  /* ---------- tela de login ---------- */
  #login{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(130deg,var(--azul),var(--verde));padding:20px}
  #login form{background:#fff;border-radius:14px;padding:30px 28px;width:100%;max-width:340px;
    box-shadow:0 10px 40px rgba(0,0,0,.25);text-align:center}
  #login .lg-icone{font-size:44px}
  #login h1{font-size:19px;margin:10px 0 2px;color:var(--texto)}
  #login p{margin:0 0 18px;color:var(--suave);font-size:12.5px}
  #login input{width:100%;padding:10px 12px;border:1px solid var(--linha);border-radius:8px;
    font-size:14px;margin-bottom:10px}
  #login .pw-wrap{position:relative}
  #login .pw-wrap input{padding-right:42px}
  #login .pw-tgl{position:absolute;right:4px;top:4px;bottom:14px;width:34px;padding:0;margin:0;
    background:transparent;border:0;cursor:pointer;font-size:17px;line-height:1;opacity:.55}
  #login .pw-tgl:hover{opacity:1;filter:none}
  #login .pw-tgl.on{opacity:1}
  #login button[type=submit]{width:100%;padding:11px;border:0;border-radius:8px;background:var(--verde);color:#fff;
    font-size:14px;font-weight:700;cursor:pointer}
  #login button[type=submit]:hover{filter:brightness(1.05)}
  #login .lg-erro{color:#c0392b;font-size:12.5px;margin-top:10px}

  /* ---------- sidebar ---------- */
  .sidebar{width:250px;flex:0 0 250px;background:var(--azul-esc);color:#dfe6f2;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar .marca{padding:18px 16px;font-weight:700;font-size:15px;line-height:1.25;
    background:linear-gradient(120deg,var(--azul),var(--verde));color:#fff}
  .sidebar .marca small{display:block;font-weight:500;opacity:.9;font-size:11px;margin-top:3px}
  .nav-sec{padding:10px 14px 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    color:#8ea3c7}
  .nav a{display:block;padding:8px 16px;font-size:13px;cursor:pointer;border-left:3px solid transparent}
  .nav a:hover{background:rgba(255,255,255,.07)}
  .nav a.ativo{background:rgba(255,255,255,.13);border-left-color:var(--verde-cl);font-weight:600;color:#fff}
  .nav-grp{padding:11px 16px 9px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:#9fb2d1;cursor:pointer;user-select:none;display:flex;align-items:center;gap:7px;font-weight:700}
  .nav-grp:hover{color:#e2e9f5;background:rgba(255,255,255,.05)}
  .nav-grp-seta{font-size:9px;transition:transform .15s ease}
  .nav-grp.aberto .nav-grp-seta{transform:rotate(90deg)}
  .nav-sub a{padding-left:28px;font-size:12.5px}
  .sidebar .rodape{margin-top:auto;padding:14px 16px;font-size:11px;color:#8ea3c7;border-top:1px solid rgba(255,255,255,.08)}

  /* ---------- conteudo ---------- */
  main{flex:1;min-width:0;padding:22px 26px 40px}
  .topo{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .topo h1{font-size:20px;margin:0}
  .topo .sub{color:var(--suave);font-size:12.5px;margin-top:2px}
  .btn{border:0;border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600}
  .btn-verde{background:var(--verde);color:#fff}
  .btn-cinza{background:#dde3ec;color:#33404f}
  .btn:hover{filter:brightness(1.05)}
  .btn-limpar{background:#eef0f3;color:#9aa4b0;border:1px solid var(--linha);
    display:inline-flex;align-items:center;gap:6px}
  .btn-limpar.on{background:#e8452c;color:#fff;border-color:#e8452c;
    box-shadow:0 3px 12px rgba(232,69,44,.4);animation:pulsaLimpar 1.8s ease-in-out infinite}
  @keyframes pulsaLimpar{0%,100%{box-shadow:0 3px 12px rgba(232,69,44,.4)}50%{box-shadow:0 3px 18px rgba(232,69,44,.7)}}

  .kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin-bottom:12px}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:11px}}
  .escopo-nota{background:#eef6ee;border:1px solid #cfe6cf;color:#2f7d32;border-radius:8px;
    padding:8px 12px;font-size:12.5px;margin-bottom:16px}
  .escopo-nota code{background:#dcefdc;padding:1px 4px;border-radius:3px}
  .ac-lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--suave);margin:8px 0 3px}
  a.lnk-rem{color:#c0392b;cursor:pointer;font-weight:600;font-size:12px}
  a.lnk-rem:hover{text-decoration:underline}

  .filtros-ver{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
    background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(20,40,80,.07);
    padding:10px 14px;margin-bottom:14px}
  .filtros-ver .fgrp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .filtros-ver .flab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);margin-right:2px}
  .fchip{border:1px solid var(--linha);background:#f4f6f9;color:#33404f;border-radius:20px;
    padding:5px 12px;font-size:12.5px;cursor:pointer;font-weight:600}
  .fchip:hover{background:#e9edf3}
  .fchip.on{background:var(--azul);border-color:var(--azul);color:#fff}
  .fchip.lisa{background:transparent;border-color:transparent;color:#2f5597;font-weight:600}
  .filtros-ver select{border:1px solid var(--linha);border-radius:7px;padding:5px 8px;font-size:12.5px;background:#fff}
  td .mrx{display:block;font-size:10.5px;color:#9aa7b5}
  /* tamanho original quando ha espaco; encolhe aos poucos (zoom/janela menor) para os 8 ficarem em uma linha */
  .kpi{background:var(--card);border-radius:10px;padding:clamp(8px,.8vw,13px) clamp(8px,.85vw,14px);box-shadow:0 1px 3px rgba(20,40,80,.07);min-width:0}
  .kpi .rot{font-size:clamp(8.5px,.68vw,11px);text-transform:uppercase;letter-spacing:.03em;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .val{font-size:clamp(16px,1.45vw,23px);font-weight:700;margin-top:3px}
  @media(max-width:900px){.kpi .rot{white-space:normal;font-size:11px}.kpi .val{font-size:23px}}
  .kpi.destaque{background:linear-gradient(120deg,var(--azul),#3f6fb0);color:#fff}
  .kpi.destaque .rot{color:#d7e3f6}
  .kpi.clic{cursor:pointer;transition:box-shadow .12s,transform .12s}
  .kpi.clic:hover{box-shadow:0 3px 12px rgba(20,40,80,.16);transform:translateY(-1px)}
  .kpi.ativa{outline:2px solid var(--azul);outline-offset:-1px;background:#eef4fc}
  .kpi.ativa .rot{color:var(--azul)}

  .grade{display:grid;grid-template-columns:1.15fr 1fr 0.9fr;gap:16px;align-items:start}
  .grade.grade-2{grid-template-columns:1.35fr 1fr}
  @media(max-width:1150px){.grade{grid-template-columns:1fr 1fr}}
  @media(max-width:820px){.grade,.grade.grade-2{grid-template-columns:1fr}}
  .painel{background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(20,40,80,.07);
    padding:14px 16px;min-width:0}
  .painel h3{margin:0 0 4px;font-size:14px}
  .painel h3 .tot{font-weight:500;font-size:11.5px;color:var(--suave);background:#f0f3f7;
    border-radius:20px;padding:1px 9px;margin-left:6px;white-space:nowrap}
  .painel-full{margin-top:16px}
  .rel-saida{background:#f5f8fc;border:1px solid var(--linha);border-radius:8px;padding:12px;
    font:12px/1.6 ui-monospace,Consolas,monospace;overflow:auto;max-height:440px;white-space:pre;
    color:var(--texto);margin:0}
  .pdet-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:6px 0 12px}
  .pdet-card{background:#f5f8fc;border:1px solid var(--linha);border-radius:8px;padding:9px 12px}
  .pdet-card .rot{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave)}
  .pdet-card .val{font-size:19px;font-weight:700;margin-top:2px}
  .painel .dica{font-size:11.5px;color:var(--suave);margin-bottom:10px}
  .painel .filtro-ativo{display:inline-block;background:#eaf6ea;color:#2f7d32;border:1px solid #bfe3c0;
    border-radius:20px;padding:2px 10px;font-size:11.5px;margin-bottom:8px;cursor:pointer}
  .scrollbox{max-height:440px;overflow-y:auto;overflow-x:hidden}
  .barra-busca{width:100%;padding:7px 10px;border:1px solid var(--linha);border-radius:7px;
    font-size:13px;margin-bottom:10px}
  .chart-wrap{position:relative}

  table.tab{width:100%;border-collapse:collapse;font-size:13px}
  table.tab th,table.tab td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--linha)}
  table.tab td.num,table.tab th.num{text-align:right;font-variant-numeric:tabular-nums}
  table.tab tbody tr:hover{background:#f5f8fc}
  table.tab tr.clic{cursor:pointer}
  table.tab tr.sel{background:#eaf6ea}
  table.tab tfoot td{font-weight:700;border-top:2px solid var(--linha)}

  .badge{display:inline-block;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:600}
  .b-Eleito{background:#e3f5e3;color:#2f7d32}
  .b-Suplente{background:#eef0f3;color:#5b6673}
  .b-Legenda{background:#e5eefb;color:#2f5597}
  .b-Branco,.b-Nulo{background:#f4f4f4;color:#8a939e}

  /* tela do menu principal (apresentação) */
  .capa{display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;min-height:calc(100vh - 62px);max-width:820px;margin:0 auto;padding:20px}
  .capa .icone{font-size:64px}
  .capa h1{font-size:44px;margin:18px 0 10px;line-height:1.12;color:var(--texto)}
  .capa .anos{font-size:20px;color:var(--azul);margin:0 0 22px}
  .capa p{color:var(--suave);margin:3px 0;font-size:16px}
  .capa .dica-menu{margin-top:26px;font-size:14px;color:var(--verde);font-weight:600}
  @media(max-width:640px){ .capa h1{font-size:30px} }

  .reg-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .reg-card{background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(20,40,80,.07);padding:14px 16px}
  .reg-card h3{margin:0 0 8px;font-size:15px;color:var(--azul)}
  .reg-card ul{margin:0;padding-left:18px}
  .reg-card li{margin:3px 0}
  .reg-card .mr{font-size:11.5px;color:var(--suave)}
</style>
</head>
<body>
<div id="login">
  <form id="loginForm" autocomplete="on">
    <div class="lg-icone">🗳️</div>
    <h1>Painel Eleições — Nova Lima</h1>
    <p>Acesso restrito. Informe usuário e senha.</p>
    <input id="lgUser" name="username" placeholder="Usuário" autocomplete="username" autocapitalize="none" spellcheck="false">
    <div class="pw-wrap">
      <input id="lgPass" name="password" type="password" placeholder="Senha" autocomplete="current-password">
      <button type="button" id="lgPassTgl" class="pw-tgl" aria-label="Mostrar senha" title="Mostrar/ocultar senha">👁</button>
    </div>
    <button type="submit">Entrar</button>
    <div class="lg-erro" id="lgErro" hidden>Usuário ou senha incorretos.</div>
  </form>
</div>
<div id="app" hidden>
  <aside class="sidebar">
    <div class="marca">Análise das Eleições<small id="marca-sub">Nova Lima / MG</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="rodape" id="rodape"></div>
  </aside>
  <main id="view"></main>
</div>

<script src="chart.umd.min.js"></script>
<script>
/* dados, usuarios e secoes mudam com frequencia: o ?v= (muda a cada 5 min) impede o navegador de mostrar versao velha em cache */
(function(){ var v = Math.floor(Date.now()/300000);
  ['dados.js','usuarios.js','secoes.js'].forEach(function(f){ document.write('<script src="'+f+'?v='+v+'"><\/script>'); }); })();
</script>
<script>
(function(){
  "use strict";
  var D = window.DADOS;
  // siglas muito longas aparecem abreviadas em todo o painel (ranking, filtros, gráfico por partido)
  var ABREV_PART = { 'REPUBLICANOS':'Rep.' };
  function abrevPart(s){ return ABREV_PART[String(s).toUpperCase()] || s; }
  ((D && D.paginas) || []).forEach(function(p){ (p.candidatos||[]).forEach(function(c){ if(c.partido) c.partido = abrevPart(c.partido); }); });
  if(!D){ document.getElementById('view').innerHTML =
    '<p style="padding:20px">Não encontrei <b>dados.js</b>. Rode <code>_gerador/gerar_dados.py</code> e mantenha os arquivos na mesma pasta.</p>'; return; }

  var fmt = new Intl.NumberFormat('pt-BR');
  var MACROS = D.macros_ordem;
  var m2M = D.micro_para_macro;
  var CORES = {azul:'#2f5597', verde:'#46b649', cinza:'#9aa7b5', amarelo:'#f2c200'};

  var st = { rota:'menu', pageId:null, selCand:null, selMacros:[], selMicros:[], selPart:null, selStatus:null, metrica:'votos', busca:'', tudo:false, navAbertos:null, usuario:null };
  var acessosEdit = null;    // cópia de trabalho da lista de usuários (tela Acessos)
  var acessosAviso = null;   // mensagem de "salvo/copiado" a mostrar uma vez, no topo da tela Acessos
  var buscaTimer=null;
  function limpaCharts(){
    try{ Object.values(Chart.instances||{}).forEach(function(c){ try{c.destroy();}catch(e){} }); }catch(e){}
  }

  document.getElementById('marca-sub').textContent = D.municipio || 'Nova Lima / MG';
  // o rodapé (com "Conectado: <nome>" e "Sair") é montado em entrar()

  function pg(id){ for(var i=0;i<D.paginas.length;i++) if(D.paginas[i].id===id) return D.paginas[i]; return null; }
  function limparFiltros(){ st.selCand=null; st.selMacros=[]; st.selMicros=[]; st.selPart=null; st.selStatus=null; st.metrica='votos'; st.busca=''; st.tudo=false; }
  function temAlgumFiltro(){ return !!(st.selCand||st.selMacros.length||st.selMicros.length||st.selPart||st.selStatus||st.busca||st.tudo||st.metrica!=='votos'); }

  /* ---------------- navegação lateral (accordion por ano) ---------------- */
  function anoDaPagina(p){
    var m = String(p.id).match(/(20\d\d)/);
    if(m) return m[1];
    return (String(p.id).indexOf('vereador')>=0) ? '2024' : '—';
  }
  function grupoDaPagina(id){
    for(var i=0;i<D.paginas.length;i++) if(D.paginas[i].id===id) return 'Eleições '+anoDaPagina(D.paginas[i]);
    return null;
  }
  function montaNav(){
    var nav = document.getElementById('nav');
    var grupos = {}, ordem = [];
    D.paginas.forEach(function(p){
      var label = 'Eleições ' + anoDaPagina(p);
      if(!grupos[label]){ grupos[label] = []; ordem.push(label); }
      grupos[label].push(p);
    });
    ordem.sort(function(a,b){ return b.localeCompare(a); });   // 2024, 2022, 2020…

    if(!st.navAbertos){
      st.navAbertos = {};
      var alvo = (st.rota==='pagina' && grupoDaPagina(st.pageId)) || ordem[0];
      st.navAbertos[alvo] = true;
    }

    var h = '<a data-rota="menu" class="'+(st.rota==='menu'?'ativo':'')+'">☰ Menu principal</a>';
    ordem.forEach(function(label){
      var aberto = !!st.navAbertos[label];
      h += '<div class="nav-grp'+(aberto?' aberto':'')+'" data-grp="'+escAttr(label)+'">'+
             '<span class="nav-grp-seta">▸</span>'+label+'</div>'+
           '<div class="nav-sub"'+(aberto?'':' hidden')+'>';
      grupos[label].forEach(function(p){
        h += '<a data-page="'+p.id+'" class="'+(st.pageId===p.id&&st.rota==='pagina'?'ativo':'')+'">'+ p.titulo +
          (p.pendente ? ' <span class="mr" style="font-size:10px">(em breve)</span>' : '') + '</a>';
      });
      h += '</div>';
    });
    h += '<div class="nav-sec">Apoio</div><a data-rota="regioes" class="'+(st.rota==='regioes'?'ativo':'')+'">Definição das Regiões</a>'+
      '<a data-rota="secoes" class="'+(st.rota==='secoes'?'ativo':'')+'">Seções 2026 🔒</a>';
    if(st.usuario && st.usuario.login==='jucilei'){
      h += '<div class="nav-sec">Administração</div><a data-rota="acessos" class="'+(st.rota==='acessos'?'ativo':'')+'">Acessos 🔒</a>';
    }
    nav.innerHTML = h;

    nav.querySelectorAll('.nav-grp').forEach(function(g){
      g.onclick = function(){
        var L = g.dataset.grp;
        st.navAbertos[L] = !st.navAbertos[L];
        montaNav();
      };
    });
    nav.querySelectorAll('a').forEach(function(a){
      a.onclick = function(){
        if(a.dataset.page){
          st.rota='pagina'; st.pageId=a.dataset.page; limparFiltros();
          var g = grupoDaPagina(a.dataset.page); if(g) st.navAbertos[g] = true;
        } else { st.rota=a.dataset.rota; }
        render();
      };
    });
  }

  /* ---------------- cálculos com filtro cruzado ---------------- */
  var _metaCache = {};
  function metaCand(p){
    if(_metaCache._id===p.id) return _metaCache.mp;
    var mp={}; p.candidatos.forEach(function(c){ mp[c.nome]={status:c.status,partido:c.partido}; });
    _metaCache = {_id:p.id, mp:mp};
    return mp;
  }
  var ORDEM_STATUS = ['Eleito','Suplente','Legenda','Branco','Nulo'];
  function statusDaPagina(p){
    var s={}; p.candidatos.forEach(function(c){ if(c.status) s[c.status]=1; });
    var lista = ORDEM_STATUS.filter(function(x){ return s[x]; });
    Object.keys(s).forEach(function(x){ if(lista.indexOf(x)<0) lista.push(x); });
    return lista;
  }
  function partidosDaPagina(p){
    var s={}; p.candidatos.forEach(function(c){ if(c.partido) s[c.partido]=1; });
    return Object.keys(s).sort();
  }
  function mostraFiltrosVereador(p){ return statusDaPagina(p).length>=3; }

  // um candidato passa pelos filtros de status/partido?
  function passaSP(meta, nome){
    var mt = meta[nome] || {};
    if(st.selStatus && mt.status!==st.selStatus) return false;
    if(st.selPart   && mt.partido!==st.selPart) return false;
    return true;
  }
  // seleção geográfica é MÚLTIPLA: st.selMacros[] OU st.selMicros[] (grupos exclusivos)
  function macroSel(m){ return st.selMacros.indexOf(m) >= 0; }
  function microSel(m){ return st.selMicros.indexOf(m) >= 0; }
  function toggleSel(arr, v){ var i = arr.indexOf(v); if(i<0) arr.push(v); else arr.splice(i,1); }
  function noArea(micro){
    if(st.selMicros.length) return microSel(micro);
    if(st.selMacros.length) return macroSel(m2M[micro]);
    return true;
  }
  function temAreaFiltro(){ return !!(st.selMicros.length || st.selMacros.length); }
  // p/ a TABELA de bairros: filtra por macro selecionada, mas NÃO colapsa quando a seleção
  // é por bairro (assim dá pra clicar em vários bairros seguidos)
  function noAreaTabela(micro){
    if(st.selMacros.length) return macroSel(m2M[micro]);
    return true;
  }
  function areaLista(){
    if(st.selMicros.length) return { tipo:'bairro', itens: st.selMicros };
    if(st.selMacros.length) return { tipo:'região', itens: st.selMacros };
    return { tipo:'', itens:[] };
  }
  function areaTexto(){
    var a = areaLista(); if(!a.itens.length) return '';
    var pl = a.itens.length > 1;
    var rot = a.tipo==='bairro' ? (pl?'Bairros':'Bairro') : (pl?'Regiões':'Região');
    return rot + ': ' + a.itens.join(', ');
  }
  function areaCurta(){
    var it = areaLista().itens; if(!it.length) return '';
    return it.length<=2 ? it.join(' + ') : (it.slice(0,2).join(' + ') + ' +'+(it.length-2));
  }

  function candFiltrados(p){
    var meta = metaCand(p), lista;
    if(temAreaFiltro()){
      var acc={};
      p.cruzamento.forEach(function(r){
        if(!noArea(r.m)) return;
        if(!passaSP(meta, r.c)) return;
        acc[r.c]=(acc[r.c]||0)+r.v;
      });
      lista = Object.keys(acc).map(function(n){

  /* --- urna por urna: lê o Boletim de Urna (BU) de cada seção já recebida pelo TSE --- */
  var CARGO_COD = { presidente_1t_2026:1, governador_2026:3, senador_2026:5, dep_federal_2026:6, dep_estadual_2026:7 };

  var BU_BASE = 'https://resultados.tse.jus.br/oficial/ele2026/arquivo-urna/3220/dados/mg/48950/0194/';
  // leitor mínimo de ASN.1 BER (formato do BU)
  function berLe(b, s, e){
    var out = [], i = s;
    while(i < e){
      var tb = b[i++], cls = tb >> 6, cons = (tb >> 5) & 1, tag = tb & 31;
      if(tag === 31){ tag = 0; var x; do{ x = b[i++]; tag = (tag << 7) | (x & 127); }while(x & 128); }
      var l = b[i++];
      if(l & 128){ var n = l & 127; l = 0; for(var k=0;k<n;k++) l = l*256 + b[i++]; }
      var nd = { cls:cls, tag:tag, vs:i, ve:i+l };
      if(cons) nd.ch = berLe(b, i, i+l);
      out.push(nd); i += l;
    }

  function berInt(n, b){ var x = 0; for(var i=n.vs;i<n.ve;i++) x = x*256 + b[i]; return x; }

    var eleicoes = r[r.length-2], aptos = 0, cargos = {};
    eleicoes.ch.forEach(function(ele){
      if(!aptos) aptos = berInt(ele.ch[1], pl);
      ele.ch[4].ch.forEach(function(rv){ rv.ch[2].ch.forEach(function(tvc){
        var cod = berInt(tvc.ch[0], pl), lista = [];
        tvc.ch[2].ch.forEach(function(v){
          var o = {};
          v.ch.forEach(function(c){
            if(c.cls!==2) return;
            if(c.tag===1) o.t = berInt(c, pl);
            else if(c.tag===2) o.q = berInt(c, pl);
            else if(c.tag===3 && c.ch){ o.p = berInt(c.ch[0], pl); o.n = berInt(c.ch[1], pl); }
          });
          lista.push(o);
        });

    });
    return { aptos:aptos, comp:comp||0, cargos:cargos };

  // baixa o BU de uma seção; devolve null se o TSE ainda não recebeu
  function buBaixa(sec){

    desenhaBarras('mChart', macros.map(function(x){return x.regiao;}), macros.map(function(x){return x.votos;}),

    /* ----- painel inferior (só na página de partido): vereadores + legenda ----- */

  function detalhePartido(p, part){
    var meta = metaCand(p), votosPorNome = {};
    if(temAreaFiltro()){
      p.cruzamento.forEach(function(r){
        if(!noArea(r.m)) return;
        var mt = meta[r.c]; if(!mt || mt.partido!==part) return;
        votosPorNome[r.c] = (votosPorNome[r.c]||0) + r.v;
      });
    } else {
      p.candidatos.forEach(function(c){ if(c.partido===part) votosPorNome[c.nome] = c.votos; });
    }
    var legenda=0, veread=[], eleitos=0;
    Object.keys(votosPorNome).forEach(function(n){
      var mt = meta[n]||{};
      if(mt.status==='Legenda'){ legenda += votosPorNome[n]; return; }
      veread.push({nome:n, votos:votosPorNome[n], status:mt.status});
      if(mt.status==='Eleito') eleitos++;
    });
    veread.sort(function(a,b){ return b.votos-a.votos; });
    var totV = veread.reduce(function(a,x){ return a+x.votos; },0);
    return {legenda:legenda, vereadores:veread, totalVereadores:totV, total:legenda+totV, eleitos:eleitos};
  }

  function kpi(rot,val,jaTexto,met){
    var cls = 'kpi' + (met ? ' clic' : '') + (met && st.metrica===met ? ' ativa' : '');
    return '<div class="'+cls+'"'+(met?' data-met="'+met+'" title="Clique para ver por região e bairro"':'')+
      '><div class="rot">'+rot+'</div><div class="val">'+
      (jaTexto?val:(val==null?'—':fmt.format(val)))+'</div></div>';
  }

  // plugin: escreve o valor (nº de votos) em cada barra
  var rotuloValor = {
    id:'rotuloValor',
    afterDatasetsDraw:function(chart){
      var ctx = chart.ctx, ds = chart.data.datasets[0];
      var meta = chart.getDatasetMeta(0);
      ctx.save();
      ctx.font = '600 11px "Segoe UI",system-ui,sans-serif';
      ctx.textBaseline = 'middle';
      meta.data.forEach(function(bar,i){
        var val = ds.data[i];
        if(val==null) return;
        var txt = fmt.format(val);
        var w = ctx.measureText(txt).width;
        var fora = bar.x + 6 + w <= chart.chartArea.right;
        if(fora){ ctx.textAlign='left'; ctx.fillStyle='#33404f'; ctx.fillText(txt, bar.x + 6, bar.y); }
        else if(bar.x - bar.base > w + 10){ ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.fillText(txt, bar.x - 6, bar.y); }
        else { ctx.textAlign='right'; ctx.fillStyle='#33404f'; ctx.fillText(txt, chart.chartArea.right, bar.y); }
      });
      ctx.restore();
    }
  };

  function alturaGrafico(n){ return Math.max(140, n*25 + 26); }

  // fonte única pro eixo Y: o que é medido tem que ser o que é desenhado
  var FONTE_TICK = '"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif';
  var MAX_CH_LINHA = 24;   // máx. de caracteres por linha do rótulo

  // quebra um nome em até 2 linhas, sem cortar palavra ("Carlos Henrique Alves" / "Da Silva")
  function quebraPalavras(txt, max){
    if(txt.length <= max) return [txt];
    var pal = txt.split(' '), l1 = '', i = 0;
    while(i < pal.length && (l1 + (l1 ? ' ' : '') + pal[i]).length <= max){ l1 += (l1 ? ' ' : '') + pal[i]; i++; }
    if(!l1){ l1 = pal[0].slice(0, max); i = 1; }          // palavra única gigante
    var resto = pal.slice(i).join(' ');
    if(resto.length > max) resto = resto.slice(0, max - 1) + '…';
    return resto ? [l1, resto] : [l1];
  }
  // "Nome  (PARTIDO)" -> nome (até 2 linhas) + partido; o partido só entra se o nome coube em 1 linha
  function quebraRotulo(s){
    s = String(s);
    var m = s.match(/^(.*?)\s+\((.+)\)\s*$/);
    var linhas = quebraPalavras(m ? m[1] : s, MAX_CH_LINHA);
    if(m && linhas.length === 1) linhas.push('(' + m[2] + ')');
    return linhas.length === 1 ? linhas[0] : linhas;
  }

  // rotulo do ranking: "Nome" + partido bem pequeno ao lado, tudo numa linha so
  var RX_PART = /^(.*?)\s+\((.+)\)\s*$/;
  var rotuloNomePartido = { id:'nomePartido', afterDatasetsDraw:function(chart){
    var ctx = chart.ctx, meta = chart.getDatasetMeta(0), area = chart.chartArea, labels = chart.data.labels;
    ctx.save(); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    var x = area.left - 6, maxW = area.left - 10;
    meta.data.forEach(function(bar, i){
      var m = String(labels[i]).match(RX_PART), nome = m ? m[1] : String(labels[i]), part = m ? m[2] : '', pw = 0;
      if(part){ ctx.font = '8px ' + FONTE_TICK; pw = ctx.measureText(part).width + 4; }
      ctx.font = '10.5px ' + FONTE_TICK;
      var avail = maxW - pw, n = nome;
      if(ctx.measureText(n).width > avail){ while(n.length > 1 && ctx.measureText(n + '…').width > avail) n = n.slice(0, -1); n += '…'; }
      ctx.fillStyle = '#3d4654'; ctx.fillText(n, x - pw, bar.y);
      if(part){ ctx.font = '8px ' + FONTE_TICK; ctx.fillStyle = '#8a94a3'; ctx.fillText(part, x, bar.y); }
    });

  function desenhaBarras(canvasId, labels, valores, cores, onClick, comPartido){
    var el = document.getElementById(canvasId);
    if(!el) return;
    var chart = new Chart(el.getContext('2d'), {
      type:'bar',
      data:{ labels:labels, datasets:[{ data:valores, backgroundColor:cores, borderRadius:3,
        maxBarThickness:22, barPercentage:0.82, categoryPercentage:0.86 }] },
      options:{
        indexAxis:'y', responsive:true, maintainAspectRatio:false,
        layout:{ padding:{ right:58, left:2, top:2, bottom:2 } },
        animation:{ duration:250 },
        events:['click'],
        plugins:{ legend:{display:false}, tooltip:{ enabled:false } },
        scales:{
          x:{ ticks:{ callback:function(v){ return fmt.format(v); }, font:{size:10} }, grid:{color:'#eef1f5'} },
          y:{
            ticks:{ font:{size:10.5, family:FONTE_TICK}, autoSkip:false, display:!comPartido,
              callback:function(v){ return quebraRotulo(this.getLabelForValue(v)); } },
            grid:{display:false},
            afterFit:function(sc){
              // reserva largura pra MAIOR LINHA já quebrada (mesma fonte do desenho), até 55% do gráfico
              var ctx = sc.chart.ctx; ctx.save();
              ctx.font = '10.5px ' + FONTE_TICK;
              var w = 0;
              if(comPartido){
                labels.forEach(function(l){
                  var m = String(l).match(RX_PART), nm = m ? m[1] : String(l), pt = m ? m[2] : '', pw = 0;
                  if(pt){ ctx.font = '8px ' + FONTE_TICK; pw = ctx.measureText(pt).width + 4; }
                  ctx.font = '10.5px ' + FONTE_TICK;
                  w = Math.max(w, ctx.measureText(nm).width + pw);
                });
              } else
              labels.forEach(function(l){
                var q = quebraRotulo(l);
                (Array.isArray(q) ? q : [q]).forEach(function(ln){ w = Math.max(w, ctx.measureText(ln).width); });
              });
              ctx.restore();
              sc.width = Math.max(sc.width, Math.min(Math.ceil(w) + 14, sc.chart.width * 0.55));
            }
          }
        },
        onClick:function(evt,els){ if(els&&els.length&&onClick) onClick(els[0].index); }
      },
      plugins: comPartido ? [rotuloValor, rotuloNomePartido] : [rotuloValor]
    });
    return chart;
  }

          '<label class="ac-lbl">Micro região</label><input class="barra-busca" id="seMicro" list="dlMicro" value="'+escAttr(val(ed.micro))+'">'+
          '<datalist id="dlMicro">'+Object.keys(micros).sort().map(function(m){ return '<option value="'+escAttr(m)+'">'; }).join('')+'</datalist>'+
          '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-verde" id="seSalvar">'+(secEditando!=null?'Salvar alteração':'Adicionar')+'</button>'+
          (secEditando!=null?'<button class="btn" id="seCancelar">Cancelar</button>':'')+'</div>'+
          '<div class="lg-erro" id="seErro" hidden></div>'+
        '</div>'+
      '</div>';

    var $ = function(id){ return document.getElementById(id); };
    $('seBusca').oninput = function(){
      secBusca = this.value; var p = this.selectionStart; render();
      var n = $('seBusca'); n.focus(); try{ n.setSelectionRange(p,p); }catch(e){}
    };
    $('sePend').onchange = function(){ secSoPend = this.checked; render(); };
    // ao escolher uma micro conhecida, preenche a macro dela
    $('seMicro').onchange = function(){ if(micros[this.value] && !$('seMacro').value) $('seMacro').value = micros[this.value]; };
    $('seSalvar').onclick = function(){
      var num = ($('seNum').value||'').replace(/\D/g,''), err = $('seErro');
      if(!num || num.length>4){ err.textContent='Informe o número da seção (até 4 dígitos).'; err.hidden=false; return; }
      num = ('0000'+num).slice(-4);
      var reg = { s:num, loc:($('seLoc').value||'').trim().toUpperCase() || 'A CONFIRMAR', end:($('seEnd').value||'').trim() || 'A CONFIRMAR',
                  macro:($('seMacro').value||'').trim() || 'A DEFINIR', micro:($('seMicro').value||'').trim() || 'A DEFINIR' };
      if(secEditando!=null){
        secEdit[secEditando] = reg; secEditando = null;
        secSalva('✏️ Seção <b>'+num+'</b> alterada — o texto já foi <b>copiado</b>. Cole aqui no chat comigo pra eu publicar.');
      } else {
        if(secEdit.some(function(s){ return s.s===num; })){ err.textContent='A seção '+num+' já existe. Use "editar".'; err.hidden=false; return; }
        secEdit.push(reg); secEdit.sort(function(a,b){ return a.s<b.s?-1:1; });
        secSalva('✅ Seção <b>'+num+'</b> adicionada — o texto já foi <b>copiado</b>. Cole aqui no chat comigo pra eu publicar.');
      }
      render();
    };
    if($('seCancelar')) $('seCancelar').onclick = function(){ secEditando = null; render(); };
    v.querySelectorAll('.lnk-ed').forEach(function(a){ a.onclick = function(){ secEditando = +a.dataset.i; render(); window.scrollTo(0,0); }; });
    v.querySelectorAll('.lnk-ex').forEach(function(a){ a.onclick = function(){
      var i = +a.dataset.i, n = secEdit[i].s;
      if(confirm('Excluir a seção '+n+'?')){
        secEdit.splice(i,1); secEditando = null;
        secSalva('🗑️ Seção <b>'+n+'</b> excluída — o texto já foi <b>copiado</b>. Cole aqui no chat comigo pra eu publicar.');
        render();
      } }; });
    $('seCopiar').onclick = function(){
      var ok = function(){ $('seStatus').textContent = 'Copiado! Cole no chat com o Claude.'; };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(textoSecoes(secEdit)).then(ok, function(){ $('seStatus').textContent='Use "baixar secoes.js".'; });
      else $('seStatus').textContent = 'Use "baixar secoes.js".';
    };
    $('seTxt').onclick = function(){ baixarArq('secoes-js.txt', textoSecoes(secEdit), 'text/plain'); $('seStatus').textContent='Baixado (renomeie para secoes.js em site\\ e publique).'; };
    $('seCsv').onclick = function(){ baixarArq('Secoes 2026.csv', csvSecoes(secEdit), 'text/csv'); };
    $('seDesf').onclick = function(){
      if(confirm('Descartar as alterações que ainda não foram publicadas?')){
        try{ localStorage.removeItem('pnl_secoes_rascunho'); }catch(e){}
        secEdit = null; secEditando = null; render();
      } };
  }

  /* ---------------- controle de acesso (multiusuário) ---------------- */
  // Cadeado simples do lado do navegador. A lista de pessoas fica em usuarios.js,
  // editável pela tela "Acessos". Hash de cada pessoa = _h(login + "::" + senha).
  function _h(s){ var x=5381; for(var i=0;i<s.length;i++) x=((x<<5)+x+s.charCodeAt(i))>>>0; return x.toString(16); }

  function listaUsuarios(){
    var l = window.USUARIOS;
    if(l && l.length) return l;
    // reserva: se usuarios.js nao carregar, mantem o acesso padrao
    return [{ nome:'Jucilei Nunes Ferreira', login:'jucilei', h:'b2b769e3', admin:true }];
  }
  function conferir(login, senha){
    var alvo = _h(String(login||'').trim().toLowerCase() + '::' + String(senha||''));
    var l = listaUsuarios();
    for(var i=0;i<l.length;i++) if(l[i].h === alvo) return l[i];
    return null;
  }
  function usuarioPorLogin(login){
    var l = listaUsuarios();
    for(var i=0;i<l.length;i++) if(l[i].login === login) return l[i];
    return null;
  }

  // registra login/saída no log de acesso do Caddy (a VPS já grava data/hora/IP de cada
  // requisição; esse pedido não busca nada, só fica marcado no log). Nunca trava a tela.
  function registrarEvento(ev, usuario){
    var u = usuario || st.usuario;
    if(!u || !u.login) return;
    try{
      var url = '/_log/'+ev+'?u='+encodeURIComponent(u.login);
      fetch(url, { method:'GET', mode:'no-cors', cache:'no-store', keepalive:true }).catch(function(){});
    }catch(e){}
  }

  function sair(motivo){
    registrarEvento('logout');
    try{ localStorage.removeItem('pnl_auth'); }catch(e){}
    try{ if(motivo) sessionStorage.setItem('pnl_saida', motivo); }catch(e){}
    location.reload();
  }

  /* sai sozinho após 5 min sem atividade */
  var INATIV_MS = 5 * 60 * 1000, inativTimer = null, ultimoToque = 0;
  function armarInatividade(){
    if(!st.usuario) return;
    var agora = Date.now();
    if(agora - ultimoToque < 1000) return;   // não re-arma a cada pixel do mouse
    ultimoToque = agora;
    clearTimeout(inativTimer);
    inativTimer = setTimeout(function(){ sair('inatividade'); }, INATIV_MS);
  }
  ['mousemove','mousedown','keydown','scroll','touchstart','click','wheel'].forEach(function(ev){
    document.addEventListener(ev, armarInatividade, {passive:true});
  });

  function entrar(usuario){
    st.usuario = usuario || null;
    var rp = document.getElementById('rodape');
    if(rp && st.usuario){
      rp.innerHTML = 'Conectado: <b>'+esc(st.usuario.nome||st.usuario.login)+'</b>'+
        '<br>Fonte: '+ (D.fonte||'TRE-MG') +'<br>Dados de: '+ (D.gerado_em||'') +
        '<br><a id="btSair" style="cursor:pointer;text-decoration:underline">Sair</a>';
      var s = document.getElementById('btSair');
      if(s) s.onclick = function(){ sair(); };
    }
    document.getElementById('login').hidden = true;
    document.getElementById('app').hidden = false;
    ultimoToque = 0; armarInatividade();
    registrarEvento('login', usuario);
    render();
    carregaApuracao();
  }

  (function(){
    var tgl = document.getElementById('lgPassTgl'), inp = document.getElementById('lgPass');
    if(tgl && inp) tgl.onclick = function(){
      var ver = inp.type === 'password';
      inp.type = ver ? 'text' : 'password';
      tgl.textContent = ver ? '🙈' : '👁';
      tgl.classList.toggle('on', ver);
      tgl.setAttribute('aria-label', ver ? 'Ocultar senha' : 'Mostrar senha');
      inp.focus();
    };
  })();

  var loginSalvo = null;
  try{ loginSalvo = localStorage.getItem('pnl_auth'); }catch(e){}
  var uSalvo = loginSalvo && loginSalvo !== '1' ? usuarioPorLogin(loginSalvo) : null;
  if(uSalvo){
    entrar(uSalvo);
  } else {
    try{ if(loginSalvo) localStorage.removeItem('pnl_auth'); }catch(e){}
    try{
      if(sessionStorage.getItem('pnl_saida') === 'inatividade'){
        var e = document.getElementById('lgErro');
        e.textContent = 'Sessão encerrada por inatividade (5 min). Entre novamente.';
        e.style.color = 'var(--suave)'; e.hidden = false;
      }
      sessionStorage.removeItem('pnl_saida');
    }catch(e){}
    document.getElementById('loginForm').addEventListener('submit', function(ev){
      ev.preventDefault();
      var u = conferir(document.getElementById('lgUser').value, document.getElementById('lgPass').value);
      if(u){
        try{ localStorage.setItem('pnl_auth', u.login); }catch(e){}
        entrar(u);
      } else {
        document.getElementById('lgErro').hidden = false;
      }
    });
    document.getElementById('lgUser').focus();
  }
})();
</script>
